<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title-kps desc-kps">
  <title id="title-kps">Сравнение каналов B2B-продаж</title>
  <desc id="desc-kps">Исходящий аутрич, контент, реклама и партнёрские сети</desc>
  <rect width="1200" height="600" rx="28" fill="#15132a"/>
  <g fill="#24203f" stroke="#8b5cf6" stroke-width="2">
    <rect x="90" y="150" width="240" height="200" rx="18"/>
    <rect x="360" y="150" width="240" height="200" rx="18"/>
    <rect x="630" y="150" width="240" height="200" rx="18"/>
    <rect x="900" y="150" width="240" height="200" rx="18"/>
  </g>
  <g fill="#f2f1fb" font-family="Arial, sans-serif">
    <text x="120" y="200" font-size="18" fill="#9df35b">Прямой выход</text>
    <text x="120" y="240" font-size="22" font-weight="700">B2B-аутрич</text>
    <text x="120" y="280" font-size="14" fill="#aaa8bd">Точный таргетинг ЛПР</text>
    <text x="120" y="305" font-size="14" fill="#aaa8bd">Быстрый первый диалог</text>

    <text x="390" y="200" font-size="18" fill="#bfa7ff">Входящий спрос</text>
    <text x="390" y="240" font-size="22" font-weight="700">Контекст / SEO</text>
    <text x="390" y="280" font-size="14" fill="#aaa8bd">Горячая потребность</text>
    <text x="390" y="305" font-size="14" fill="#aaa8bd">Высокая стоимость клика</text>

    <text x="660" y="200" font-size="18" fill="#bfa7ff">Сеть влияния</text>
    <text x="660" y="240" font-size="22" font-weight="700">Партнёрства</text>
    <text x="660" y="280" font-size="14" fill="#aaa8bd">Высокое доверие</text>
    <text x="660" y="305" font-size="14" fill="#aaa8bd">Процент с чека</text>

    <text x="930" y="200" font-size="18" fill="#bfa7ff">Экспертиза</text>
    <text x="930" y="240" font-size="22" font-weight="700">Рекомендации</text>
    <text x="930" y="280" font-size="14" fill="#aaa8bd">Максимальная конверсия</text>
    <text x="930" y="305" font-size="14" fill="#aaa8bd">Сложно масштабировать</text>
  </g>
</svg>
