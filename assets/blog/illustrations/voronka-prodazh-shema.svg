<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title-vps desc-vps">
  <title id="title-vps">Воронка B2B-продаж</title>
  <desc id="desc-vps">Конверсия от первого касания до закрытия контракта</desc>
  <rect width="1200" height="600" rx="28" fill="#15132a"/>
  <circle cx="600" cy="300" r="150" fill="#8b5cf6" opacity=".1"/>
  <g fill="#24203f" stroke="#8b5cf6" stroke-width="2">
    <rect x="100" y="100" width="1000" height="70" rx="14"/>
    <rect x="220" y="190" width="760" height="70" rx="14"/>
    <rect x="340" y="280" width="520" height="70" rx="14"/>
    <rect x="460" y="370" width="280" height="70" rx="14" fill="#2e2a52" stroke="#9df35b"/>
  </g>
  <g fill="#f2f1fb" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="142" font-size="20" font-weight="700">1. Охват целевой аудитории: холодные контакты и входящий интерес</text>
    <text x="600" y="232" font-size="20" font-weight="700">2. Квалифицированный лид (SQL): выявлена задача и бюджет</text>
    <text x="600" y="322" font-size="20" font-weight="700">3. Встреча / демонстрация и защита решения</text>
    <text x="600" y="412" font-size="20" font-weight="700" fill="#9df35b">4. Оплата и долгосрочный контракт</text>
  </g>
</svg>
